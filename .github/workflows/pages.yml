name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/website-url-retrieval-g1on8y
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on for the repo if it is not already,
      # so this does not need anyone to flip a switch in Settings first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish only the site itself, not the repo's tooling, docs or skills.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html about.html programs.html gallery.html contact.html free-class.html _site/
          cp -r assets images _site/
          ls -R _site | head -40

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
